plugins {
    id 'java'
    // ModDevGradle (MDG). This is the toolchain the modern NeoForge 1.21.1 MDK uses.
    // TODO(verify): latest 2.x at https://github.com/neoforged/ModDevGradle / plugin portal.
    id 'net.neoforged.moddev' version '2.0.78'
}

version = project.mod_version
group = project.mod_group

base {
    archivesName = project.mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

repositories {
    mavenCentral()
    // JEI lives here:
    maven {
        name = 'BlameJared (JEI)'
        url = 'https://maven.blamejared.com/'
    }
    // Fallback mirror for JEI:
    maven {
        name = 'ModMaven'
        url = 'https://modmaven.dev'
    }
}

neoForge {
    version = project.neo_version

    // Remove this block if you deleted the parchment_* properties.
    parchment {
        minecraftVersion = project.parchment_minecraft_version
        mappingsVersion = project.parchment_mappings_version
    }

    runs {
        client {
            client()
            // This is a client-side mod; a server run isn't needed, but you can add one for testing.
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet sourceSets.main
        }
    }

    // Tier B: load the test source set as the mod itself so FML boots the game.
    // testedMod is REQUIRED -- enable() alone leaves the registries un-bootstrapped.
    unitTest {
        enable()
        testedMod = mods."${project.mod_id}"
    }
}

dependencies {
    // --- JUnit 5 for the game-bootstrapped 'test' suite (Tier B) ---
    testImplementation platform("org.junit:junit-bom:5.10.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"

    // Compile against the JEI API only; the full JEI jar is pulled in at runtime.
    compileOnly "mezz.jei:jei-${project.minecraft_version}-common-api:${project.jei_version}"
    compileOnly "mezz.jei:jei-${project.minecraft_version}-neoforge-api:${project.jei_version}"
    // Use the full JEI build in the dev client so you can actually see the gating work:
    runtimeOnly "mezz.jei:jei-${project.minecraft_version}-neoforge:${project.jei_version}"

    // Mixin annotation processor. Not required to build or run a mixin on NeoForge, but it
    // turns "my @Inject silently didn't apply" into a compile error -- which is the only
    // way to catch a bad target offline, since there is no display to boot the game on.
    annotationProcessor "net.fabricmc:sponge-mixin:${project.mixin_version}"
}

// Interpolate gradle.properties values into neoforge.mods.toml at build time.
tasks.named('processResources', ProcessResources).configure {
    def replace = [
        mod_id              : project.mod_id,
        mod_name            : project.mod_name,
        mod_version         : project.mod_version,
        mod_authors         : project.mod_authors,
        mod_license         : project.mod_license,
        mod_description     : project.mod_description,
        minecraft_version_range: project.minecraft_version_range,
        neo_version_range   : project.neo_version_range,
        loader_version_range: project.loader_version_range,
    ]
    inputs.properties replace
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replace
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

// Tier A lives in its own source set (src/pureTest/java) so it runs WITHOUT booting FML.
// MDG only ever attaches the game to the 'test' suite, so this one stays pure and fast.
testing {
    suites {
        pureTest(JvmTestSuite) {
            useJUnitJupiter('5.10.2')
            dependencies {
                // Depend on the mod's own classes so Tier A tests the REAL rule rather than a
                // restatement of it. This does mean Tier A now requires main to compile, so it is
                // no longer fully decoupled from the Minecraft classpath -- but the artifacts are
                // cached, and a test that guards production code is worth a couple of seconds.
                implementation project()
            }
        }
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('pureTest')
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging {
        events "passed", "failed", "skipped"
        exceptionFormat = "full"
    }
}

// Pairs with the annotationProcessor above.
tasks.named('compileJava', JavaCompile).configure {
    options.compilerArgs += [
        // NeoForge 1.21.1 runs on official Mojang names, so there is no searge/notch
        // obfuscation to map into and no refmap to emit. The AP's bundled ObfuscationServiceMCP
        // does not know that and raises these as hard errors, so downgrade them.
        '-AMSG_NO_OBFDATA_FOR_TARGET=warning',
        '-AMSG_NO_OBFDATA_FOR_OVERWRITE=warning',
        '-AMSG_NO_OBFDATA_FOR_SOFT_IMPLEMENTS=warning',
        // Keep the part worth having, and make it fatal: a target method that does not exist
        // in the target class fails the build instead of warning.
        '-AMSG_TARGET_ELEMENT_NOT_FOUND=error',
    ]
}

// =====================================================================================
// Offline verification for the third-party compat mixins.
//
// The Mixin annotation processor is this project's only offline proof that an @Inject
// target exists -- and it cannot see the compat mixins at all, because a @Pseudo mixin
// with a string `targets =` is invisible to it. Compiling against the real jars would
// restore that, but it would make the primary build depend on a CurseForge/Modrinth
// download for everyone, to type-check two cosmetic callbacks. Neither mod publishes an
// API artifact to any Maven repository (checked: Fuzs's raw-GitHub Maven has no
// pickupnotifier directory; Obscuria's has no loot_journal).
//
// So the check is opt-in instead, and reads the signatures straight out of a jar the
// user already has:
//
//     ./gradlew verifyCompatTargets -PcompatJars=/path/PickUpNotifier-...jar,/path/loot_journal-...jar
//
// It uses javap from the JDK, so it needs no new dependency and no network. A class that
// is in none of the supplied jars is SKIPPED, not failed -- the point is to check the
// jars you have, not to demand all of them.
// =====================================================================================

ext.compatMixinTargets = [
    [
        modId    : 'pickupnotifier',
        mixin    : 'com.gatedjei.compat.mixin.pickupnotifier.ItemDisplayEntryMixin',
        className: 'fuzs.pickupnotifier.client.gui.entry.ItemDisplayEntry',
        members  : [
            ['<init>',       '(Lnet/minecraft/world/item/ItemStack;I)V'],
            ['getEntryName', '()Lnet/minecraft/network/chat/Component;'],
        ],
    ],
    [
        modId    : 'loot_journal',
        mixin    : 'com.gatedjei.compat.mixin.lootjournal.ItemPickupEventMixin',
        className: 'dev.obscuria.lootjournal.client.events.ItemPickupEvent',
        members  : [
            ['<init>',      '(Lnet/minecraft/client/player/AbstractClientPlayer;Lnet/minecraft/world/item/ItemStack;)V'],
            ['displayName', '()Lnet/minecraft/network/chat/Component;'],
        ],
    ],
]

tasks.register('verifyCompatTargets') {
    group = 'verification'
    description = 'Check the compat mixins\' targets against real mod jars (-PcompatJars=a.jar,b.jar).'
    doLast {
        def raw = (project.findProperty('compatJars') ?: '').toString()
        def jars = raw.split(',').collect { it.trim() }.findAll { !it.isEmpty() }.collect { file(it) }
        if (jars.isEmpty()) {
            println 'verifyCompatTargets: no -PcompatJars given, nothing to check.'
            println '  usage: ./gradlew verifyCompatTargets -PcompatJars=/path/to/PickUpNotifier-....jar'
            return
        }
        def missing = jars.findAll { !it.isFile() }
        if (!missing.isEmpty()) {
            throw new GradleException("verifyCompatTargets: no such file(s): ${missing*.path}")
        }
        def classpath = jars*.absolutePath.join(File.pathSeparator)

        def failures = []
        def checked = 0
        compatMixinTargets.each { target ->
            def proc = new ProcessBuilder(['javap', '-p', '-s', '-cp', classpath, target.className])
                    .redirectErrorStream(true).start()
            def output = proc.inputStream.text
            proc.waitFor()
            if (proc.exitValue() != 0) {
                println "verifyCompatTargets: ${target.className} is in none of the supplied jars -- skipped."
                return
            }
            target.members.each { member ->
                def (name, descriptor) = member
                // javap prints a member's name on one line and "descriptor: ..." on the next. A
                // constructor is printed under the class's own name, so for <init> the descriptor
                // is the only thing to match on -- which is enough, since no two members of these
                // classes share a descriptor.
                def hasDescriptor = output.contains("descriptor: ${descriptor}")
                def hasName = name == '<init>' || output.contains(name)
                checked++
                if (!hasDescriptor || !hasName) {
                    failures << "  ${target.className}#${name}${descriptor}\n" +
                                "    not found -- ${target.mixin} will no longer apply.\n" +
                                "    (the mod has moved or renamed it; the integration degrades to no marker)"
                }
            }
        }
        if (!failures.isEmpty()) {
            throw new GradleException("verifyCompatTargets: ${failures.size()} target(s) no longer match:\n"
                    + failures.join('\n'))
        }
        println "verifyCompatTargets: ${checked} target member(s) verified against ${jars.size()} jar(s)."
    }
}
