org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true

# === Mod metadata ===
mod_id=gatedjei
mod_name=JEI Gated Discovery
mod_version=1.0.8
mod_group=com.gatedjei
mod_authors=you
mod_license=MIT
mod_description=Hides JEI recipes until you have discovered (touched) all of their input ingredients.

# === Minecraft / Forge (1.20.1 backport) ===
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.20.2)
# Forge 47.x is the 1.20.1 line: https://files.minecraftforge.net/net/minecraftforge/forge/index_1.20.1.html
forge_version=47.4.0
forge_version_range=[47,)
# On 1.20.1 the Forge loader version is the MC major ("47"), unlike NeoForge's "4".
loader_version_range=[47,)

# Mojang official mappings. Swap to Parchment by adding the librarian plugin if you prefer
# named method parameters in the dev environment.
mapping_channel=official
mapping_version=1.20.1

# === JEI ===
# 1.20.1 JEI is the 15.x line: https://maven.blamejared.com/mezz/jei/
jei_version=15.55.0.201
jei_version_range=[15,)
