modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''
${mod_description}
'''
# This is a CLIENT-side-only mod. It must never block joining a server, so we ignore version
# matching during the client<->server handshake.
displayTest = "IGNORE_ALL_VERSION"

# --- Mixins ---
# Top-level list (NOT namespaced by modId, unlike [[dependencies.<modid>]]).
# FML reads the "mixins" array and requires a "config" key; the value is a path
# relative to the jar root.
[[mixins]]
config = "${mod_id}.mixins.json"

# Compat mixin configs, one per third-party pickup display. Kept separate from the config above
# for three reasons: Mixin claims the package named in a config, so each needs its own package;
# each carries its own IMixinConfigPlugin that switches the whole config off unless the mod it
# targets is installed; and a problem in an optional cosmetic integration must not be able to
# affect the mixins that discovery itself depends on.
#
# NeoForge 21.1 has no declarative gate here -- [[mixins]] accepts only "config" on this version
# (verified: FML loader 4.0.34 contains no "requiredMods" string), which is why the gate is a
# plugin rather than a line of TOML.
#
# Note the deliberate absence of matching [[dependencies]] entries. An "optional" dependency with
# a version range REFUSES TO LOAD when the mod is present but outside the range, so declaring one
# would turn a future release of a cosmetic integration into a game that will not start. Presence
# is detected at runtime instead.
[[mixins]]
config = "${mod_id}.pickupnotifier.mixins.json"

[[mixins]]
config = "${mod_id}.lootjournal.mixins.json"

# --- Dependencies ---

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "CLIENT"

# JEI is required for this mod to do anything. If you'd rather make it soft, change type to "optional".
[[dependencies.${mod_id}]]
modId = "jei"
type = "required"
versionRange = "[19,)"
ordering = "AFTER"
side = "CLIENT"
